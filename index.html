<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Öffentliche Finanzwirtschaft in Deutschland</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="quiz-container">
        <h1>Quiz: Öffentliche Finanzwirtschaft</h1>
        <div id="progress-container">
            <p id="progress-text">Frage 1 von 30</p>
        </div>
        <div id="quiz-content">
            <h2 id="question">Frage wird geladen...</h2>
            <div id="answer-buttons" class="btn-grid">
                <!-- Antwort-Buttons werden hier dynamisch eingefügt -->
            </div>
        </div>
        <div class="controls">
            <button id="next-btn" class="next-btn btn hide">Weiter</button>
        </div>
        <div id="results-container" class="hide">
            <h2>Quiz beendet!</h2>
            <p id="score-text">Auswertung: Sie haben X von Y Fragen richtig beantwortet.</p>
            <p id="percentage-text"></p>
            <button id="restart-btn" class="restart-btn btn">Neu starten</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
